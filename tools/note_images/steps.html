<style>
body{height:670px}

<div class="wrap"><h2>LocaTesterの使い方は<em>3ステップ</em></h2><div class="row"><div class="card"><div class="num">1</div><div class="t">iPhoneを<br>USBでつなぐ</div><div class="d">Apple Devicesアプリを<br>入れて、iPhoneで<br>「信頼」をタップ</div></div><div class="card"><div class="num">2</div><div class="t">start.batを<br>ダブルクリック</div><div class="d">ブラウザに地図の画面が<br>開きます。初回は準備に<br>数分かかります</div></div><div class="card"><div class="num">3</div><div class="t">地図をクリック<br>してセット</div><div class="d">「この位置をセット」を<br>押すと、iPhoneの<br>位置情報が変わります</div></div></div></div></body></html>
